name: publish

# Tag-triggered release: push a vX.Y.Z tag (e.g. v0.1.0) to build, test, pack the three
# NuGet packages and publish them to nuget.org plus a GitHub release. The version is
# derived from the tag - the single source of truth - not from the csproj.
#
# Publish uses NuGet Trusted Publishing (OIDC): no long-lived API key in secrets; the
# short-lived key is exchanged by NuGet/login@v1. Register the matching policy on
# nuget.org (owner: ghostflyby, repo: ghostflyby/JupyterSharp, workflow file: publish.yml).
#
# The managed dlls are identical on every OS (no P/Invoke), so one build job and one
# nupkg per package is the whole flow.
on:
  push:
    tags: ['v*.*.*']

# A publish must never be cancelled mid-flight (a half-pushed release), and two pushes
# of the same tag cannot happen - but guard anyway: same-ref publishes serialize.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Every run: step uses pwsh (PowerShell Core), preinstalled on all GitHub-hosted
# runners, so the same script syntax works everywhere - no bash-isms anywhere.
defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build, test & pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set version from tag
        run: |
          "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      # A release candidate must pass the full suite before anything ships.
      # No --nologo here: in Microsoft.Testing.Platform mode dotnet test forwards
      # unrecognized options to the test app, and the xunit v3 runner spells it
      # -noLogo, so --nologo aborts the run with exit code 5.
      - name: Test
        run: dotnet test Ghostflyby.Jupyter.slnx -c Release

      # Every packable project gets the tag version. Client and Kernel declare a package
      # dependency on Ghostflyby.Jupyter; packing them pulls the core project into the same
      # version, so those nuspec dependencies match the package pushed in this same run.
      - name: Pack
        run: |
          # The csproj enables IncludeSymbols/snupkg; pass them explicitly anyway so
          # the pack intent is visible here (--symbols as a CLI switch is parsed by
          # pwsh into MSBuild as an unknown switch and fails).
          dotnet pack Ghostflyby.Jupyter/Ghostflyby.Jupyter.csproj -c Release --nologo -o pkg -p:Version=$env:VERSION -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          dotnet pack Ghostflyby.Jupyter.Client/Ghostflyby.Jupyter.Client.csproj -c Release --nologo -o pkg -p:Version=$env:VERSION -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          dotnet pack Ghostflyby.Jupyter.Kernel/Ghostflyby.Jupyter.Kernel.csproj -c Release --nologo -o pkg -p:Version=$env:VERSION -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg
          path: pkg/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to nuget.org + GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write lets NuGet/login exchange the OIDC token for a short-lived NuGet
    # API key (Trusted Publishing); contents: write is for gh release create.
    permissions:
      id-token: write
      contents: write
    steps:
      # gh release create resolves the repository through git, so this job needs the
      # checkout even though it builds nothing (packages come from the build job).
      # Full history: the tag-on-main guard runs git merge-base --is-ancestor, and on
      # a shallow (depth-1) checkout the two commits share no common ancestor unless
      # the tag is exactly main's tip - a hotfix tag on an older main commit would be
      # falsely rejected.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: pkg
          path: pkgs

      - name: Validate tag is SemVer and not a downgrade
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "VERSION=$version" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "tag '$env:GITHUB_REF_NAME' is not a valid vX.Y.Z[(-suffix)] version"
          }
          # Refuse versions nuget.org already has, before anything is pushed. This is
          # the republish gate: it gives traceability-only tag pushes (a re-tag of a
          # historical version) a clear early exit instead of a push that cannot succeed.
          # All three packages: a partial previous release must not be silently re-pushed.
          foreach ($id in 'jupytersharp', 'jupytersharp.client', 'jupytersharp.kernel') {
              $index = try { Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/$id/index.json" -TimeoutSec 30 } catch { $null }
              if ($index -and ($index.versions -contains $version)) {
                  throw "version '$version' of $id is already published on nuget.org - refusing to republish (traceability tag only)"
              }
          }
          # The tag commit must sit on main's history: a tag on a side branch or a
          # stray commit never reaches the production publish.
          git fetch origin main
          $onMain = $false
          try {
              git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main 2>$null
              $onMain = ($LASTEXITCODE -eq 0)
          } catch {
              $global:LASTEXITCODE = 0
              $onMain = $false
          }
          if (-not $onMain) { throw "tag commit $env:GITHUB_SHA is not an ancestor of origin/main" }
          # And its CI must have passed: a release rides on the commit the
          # three-platform suite ran against.
          $run = try {
              gh run list --workflow ci.yml --commit "$env:GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>$null
          } catch {
              $global:LASTEXITCODE = 0
              $null
          }
          if (-not $run) { throw "no successful (completed) ci.yml run found for tag commit $env:GITHUB_SHA - merge first, wait for CI on main to go green, then tag" }
          Write-Host "ok: tag commit is on main with green CI (run $run)"
          # 'gh release list' exits 1 when no release exists yet (first publish); with
          # $PSNativeCommandUseErrorActionPreference = $true that becomes a terminating
          # error, so wrap it. The catch must also reset $LASTEXITCODE: pwsh exits the
          # script with the last external command's code, so a swallowed '1' would still
          # fail the step.
          $latest = try {
              gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>$null
          } catch {
              $global:LASTEXITCODE = 0
              $null
          }
          if ($latest) {
              function Test-Newer([string]$candidate, [string]$previous) {
                  $c = $candidate -split '-'; $p = $previous -split '-'
                  $cNum = [version]$c[0]; $pNum = [version]$p[0]
                  if ($cNum -gt $pNum) { return $true }
                  if ($cNum -lt $pNum) { return $false }
                  $cPre = if ($c.Count -gt 1) { $c[1] } else { '' }
                  $pPre = if ($p.Count -gt 1) { $p[1] } else { '' }
                  if ($pPre -eq '' -and $cPre -ne '') { return $false }   # 1.0.0-beta < 1.0.0
                  if ($cPre -eq '' -and $pPre -ne '') { return $true }
                  return $cPre -gt $pPre
              }
              $latestV = $latest -replace '^v', ''
              if (-not (Test-Newer $version $latestV)) {
                  throw "version '$version' is not newer than the latest release '$latestV'"
              }
              Write-Host "ok: $version > $latestV"
          } else {
              Write-Host 'no previous release; this is the first publish'
          }
          # Normal path ends cleanly even if an external command left $LASTEXITCODE set;
          # throw paths above terminate with a non-zero exit before reaching here.
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify all three packages are well-formed
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = @("Ghostflyby.Jupyter.$env:VERSION.nupkg", "Ghostflyby.Jupyter.Client.$env:VERSION.nupkg", "Ghostflyby.Jupyter.Kernel.$env:VERSION.nupkg")
          foreach ($name in $expected) {
              $path = "pkgs/$name"
              if (-not (Test-Path -LiteralPath $path)) { throw "missing package: $name" }
              $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $path))
              try {
                  $dll = @($zip.Entries | Where-Object { $_.FullName -like 'lib/net10.0/*.dll' })
                  $nuspec = @($zip.Entries | Where-Object { $_.FullName -like '*.nuspec' })
                  if ($dll.Count -ne 1) { throw "${name}: expected 1 lib dll, found $($dll.Count)" }
                  if ($nuspec.Count -ne 1) { throw "${name}: expected 1 nuspec, found $($nuspec.Count)" }
              } finally { $zip.Dispose() }
          }

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org username (profile name), not an email address. The temp key is
          # valid for 1 hour and is exchanged right before the push.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: |
          # Symbol packages push to nuget.org with the same key (no extra auth).
          # The snupkg pushes carry --skip-duplicate: dotnet push retries a fresh
          # snupkg PUT after nuget.org already accepted it (Created), and the retry
          # gets 409 "another copy pending validation" - a race that fails an otherwise
          # successful release. The nupkg pushes stay without it: the exists-check
          # above is their republish gate.
          foreach ($id in 'Ghostflyby.Jupyter', 'Ghostflyby.Jupyter.Client', 'Ghostflyby.Jupyter.Kernel') {
              dotnet nuget push "pkgs/$id.$env:VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
              dotnet nuget push "pkgs/$id.$env:VERSION.snupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
          }

      - name: Create GitHub release
        run: |
          gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" `
            --notes "Ghostflyby.Jupyter $env:VERSION - see https://www.nuget.org/packages/Ghostflyby.Jupyter/$env:VERSION for package details. Symbol packages (.snupkg) are on nuget.org; debuggers fetch them automatically." `
            "pkgs/Ghostflyby.Jupyter.$env:VERSION.nupkg" "pkgs/Ghostflyby.Jupyter.$env:VERSION.snupkg" `
            "pkgs/Ghostflyby.Jupyter.Client.$env:VERSION.nupkg" "pkgs/Ghostflyby.Jupyter.Client.$env:VERSION.snupkg" `
            "pkgs/Ghostflyby.Jupyter.Kernel.$env:VERSION.nupkg" "pkgs/Ghostflyby.Jupyter.Kernel.$env:VERSION.snupkg"
        env:
          GH_TOKEN: ${{ github.token }}
